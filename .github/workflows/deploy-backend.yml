# Builds the backend image, runs the migrations as a Cloud Run job, then deploys the API.
# One-time setup (project, Artifact Registry, Workload Identity Federation, secrets):
# devops/cloud-run/README.md.
name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - "devops/cloud-run/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  REGION: asia-southeast1
  IMAGE: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/vipharmind/pharma-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: no service account key in GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f backend/Dockerfile -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Migrate the database
        run: |
          gcloud run jobs update vipharmind-migrate \
            --image "${IMAGE}:${GITHUB_SHA}" --region "${REGION}"
          gcloud run jobs execute vipharmind-migrate --region "${REGION}" --wait

      - name: Deploy the API
        run: |
          gcloud run deploy vipharmind-api \
            --image "${IMAGE}:${GITHUB_SHA}" --region "${REGION}"

      - name: Smoke test
        run: |
          url="$(gcloud run services describe vipharmind-api --region "${REGION}" --format 'value(status.url)')"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${url}/api/v1/health"
