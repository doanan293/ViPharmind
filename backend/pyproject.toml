[project]
name = "pharma-agent"
version = "0.1.0"
description = "ViPharmind backend: a pharma AI agent over a multi-collection pharma corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19,<2",
    "fastapi>=0.141,<1",
    "fastapi-users[oauth,sqlalchemy]>=15.0,<16",
    "httpx>=0.27,<1",
    "langchain>=1.4,<2",
    "langchain-core>=1.4,<2",
    "langchain-openai>=1.6,<2",
    "langfuse>=4.0,<5",
    "langgraph>=1.2,<2",
    "openai>=3.0,<4",
    "phonenumbers>=9.0,<10",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.19,<2",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "starlette-csrf>=3.0,<4",
    "typer>=0.21",
    "typesafe-sdk>=0.7,<1",
    "uvicorn>=0.52,<1",
]

[project.scripts]
pharma-agent = "pharma_agent.cli:app"

[dependency-groups]
dev = [
    "respx==0.23.1",
    "testcontainers==4.15.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../ruff.toml"
src = ["src", "tests"]

# docs/engineering-guide.md, section "Code": function size and docstrings on top of the shared
# rules. Complexity and statement count stand in for "keep functions short".
[tool.ruff.lint]
# On top of docstrings and function size: magic values, blocking calls in async code, security
# (bandit), unused arguments, blind excepts, boolean positional flags, commented-out code,
# print, naive datetimes, os.path, and small return/performance smells.
extend-select = [
    "C90", "D", "PLR0915",
    "PLR2004", "ASYNC", "S", "ARG", "BLE", "FBT", "ERA", "T20", "DTZ", "PTH", "RET", "PIE",
    "PERF",
]
# D100, D104: module and package docstrings are optional; classes, functions and methods
# still need Google-style docstrings.
extend-ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
# Tests: names describe the behaviour, so no docstrings (D); pytest asserts with `assert`
# (S101); expected values are literals (PLR2004); fixture passwords are fake (S105-S107).
"tests/**" = ["D", "S101", "PLR2004", "S105", "S106", "S107"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 40

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Docker (run with -m integration)"]
addopts = ["--import-mode=importlib", "-m", "not integration"]
filterwarnings = ["error"]

[tool.importlinter]
root_package = "pharma_agent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "api > infrastructure > application > domain"
type = "layers"
layers = [
    "pharma_agent.api",
    "pharma_agent.infrastructure",
    "pharma_agent.application",
    "pharma_agent.domain",
]

[[tool.importlinter.contracts]]
name = "domain is framework-free"
type = "forbidden"
source_modules = ["pharma_agent.domain"]
forbidden_modules = [
    "langgraph",
    "langchain",
    "langchain_core",
    "openai",
    "qdrant_client",
    "sqlalchemy",
    "fastapi",
    "langfuse",
    "httpx",
    "fastembed",
    "typesafe_sdk",
]

[[tool.importlinter.contracts]]
name = "application reaches databases, SDKs and transports only through domain ports"
type = "forbidden"
source_modules = ["pharma_agent.application"]
forbidden_modules = [
    "openai",
    "qdrant_client",
    "sqlalchemy",
    "psycopg",
    "alembic",
    "fastapi",
    "fastapi_users",
    "starlette",
    "langfuse",
    "httpx",
    "typesafe_sdk",
    "typer",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "application features are independent"
type = "independence"
modules = [
    "pharma_agent.application.access",
    "pharma_agent.application.account",
    "pharma_agent.application.admin",
    "pharma_agent.application.audit",
    "pharma_agent.application.chat",
    "pharma_agent.application.conversation",
    "pharma_agent.application.corpus",
    "pharma_agent.application.feedback",
    "pharma_agent.application.memory",
    "pharma_agent.application.organizations",
]

[[tool.importlinter.contracts]]
name = "api calls application, never domain"
type = "forbidden"
source_modules = ["pharma_agent.api"]
forbidden_modules = ["pharma_agent.domain"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "routers reach infrastructure only through api.deps and api.app"
type = "forbidden"
source_modules = ["pharma_agent.api.routers"]
forbidden_modules = ["pharma_agent.infrastructure"]
allow_indirect_imports = true

[tool.vercel]
# Vercel Functions import this FastAPI instance; `pharma-agent serve` stays the way to run
# the API anywhere else.
entrypoint = "src.pharma_agent.api.asgi:app"
