[project]
name = "pharma-agent"
version = "0.1.0"
description = "Pharma AI agent backend over the Vietnamese National Drug Formulary corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=4.0,<5",
    "alembic>=1.19,<2",
    "fastapi>=0.141,<1",
    "fastapi-users[oauth,sqlalchemy]>=15.0,<16",
    "google-auth>=2.40,<3",
    "google-cloud-tasks>=2.19,<3",
    "httpx>=0.27,<1",
    "langchain-core>=1.4,<2",
    "langfuse>=4.0,<5",
    "langgraph>=1.2,<2",
    "openai>=3.0,<4",
    "phonenumbers>=9.0,<10",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "qdrant-client>=1.19,<2",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "starlette-csrf>=3.0,<4",
    "typer>=0.21",
    "uvicorn>=0.52,<1",
]

[project.scripts]
pharma-agent = "pharma_agent.cli:app"

[dependency-groups]
dev = [
    "respx==0.23.1",
    "testcontainers==4.15.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../ruff.toml"
src = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Docker (run with -m integration)"]
addopts = ["--import-mode=importlib", "-m", "not integration"]
filterwarnings = ["error"]
