project-includes = ["src", "tests"]
project-excludes = ["**/.venv/**", "**/__pycache__/**", "**/*.pyc"]
search-path = ["src", ".", "typings"]
python-version = "3.12"
ignore-errors-in-generated-code = true

# An `# pyrefly: ignore` that no longer suppresses anything is an error, so
# workarounds for upstream bugs expire on their own.
[errors]
unused-ignore = true
# Every signature, lambda, container and type argument is typed; overrides are marked.
implicit-any = "error"
missing-override-decorator = "error"
unannotated-parameter = "error"
unannotated-return = "error"
