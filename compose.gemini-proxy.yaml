# The LLM roles through cli-proxy-api (Gemini via an Antigravity login) instead of the
# provider in backend/.env. Setup: devops/cli-proxy-api/config.example.yaml. Use with:
#   docker compose -f compose.yaml -f compose.gemini-proxy.yaml up -d
# The API key and model names stay in backend/.env (see its PHARMA_LLM__* comments).
# Overridable: CLI_PROXY_API_PORT.

services:
  # OpenAI-compatible LLM gateway. Setup: devops/cli-proxy-api/config.example.yaml.
  cli-proxy-api:
    image: eceasy/cli-proxy-api:v8.0.28
    ports:
      - "${CLI_PROXY_API_PORT:-8317}:8317"
    environment:
      TZ: "Asia/Ho_Chi_Minh"
    configs:
      - source: cli-proxy-api
        target: /CLIProxyAPI/config.yaml
    volumes:
      # OAuth credential files (auth-dir in the config).
      - cli_proxy_auth:/root/.cli-proxy-api
    healthcheck:
      # The image has bash but no curl or wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8317 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    environment:
      PHARMA_LLM__DEFAULT__BASE_URL: "http://cli-proxy-api:8317/v1"
    depends_on:
      cli-proxy-api:
        condition: service_healthy

configs:
  cli-proxy-api:
    file: ./devops/cli-proxy-api/config.yaml

volumes:
  cli_proxy_auth:
