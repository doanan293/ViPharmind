# Local stack for the pharma agent. Run from the repository root. Every ${VAR:-default} below
# has a working default, so no root .env exists; override one with a shell variable, e.g.
# `WEB_PORT=8081 docker compose up -d`. Overridable: ports (WEB_PORT, POSTGRES_PORT,
# QDRANT_HTTP_PORT), COOKIE_SECURE and POSTGRES_USER/PASSWORD/DB.
#
# By default the backend calls the model providers configured in backend/.env (DeepInfra).
# Two override files add local alternatives:
#   compose.local-models.yaml  llama.cpp embedding and reranker servers on this machine (CPU)
#   compose.llm-proxy.yaml     the cli-proxy-api gateway (Gemini, Claude, ...) for the LLM roles
# e.g. `docker compose -f compose.yaml -f compose.local-models.yaml up -d`.
# Services reach each other by service name on the default network; host ports are published
# only for the browser (nginx) and for tools that run on the host (backend via `uv run`,
# pharma-lab).
name: vipharmind

x-backend: &backend
  build:
    # The backend is a uv workspace member, so the image builds from the repository root.
    context: .
    dockerfile: backend/Dockerfile
  image: vipharmind-pharma-agent:local
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    PHARMA_API__HOST: "0.0.0.0"
    PHARMA_API__PORT: "8000"
    # Google OAuth returns to the single nginx origin.
    PHARMA_AUTH__FRONTEND_URL: "http://localhost:${WEB_PORT:-8080}"
    # Secure session cookies work on http://localhost; run with COOKIE_SECURE=false when the
    # stack is opened over plain HTTP from another host name (for example a LAN IP).
    PHARMA_AUTH__COOKIE_SECURE: "${COOKIE_SECURE:-true}"
    PHARMA_POSTGRES__DSN: "postgresql+psycopg://${POSTGRES_USER:-vipharmind}:${POSTGRES_PASSWORD:-vipharmind}@postgres:5432/${POSTGRES_DB:-vipharmind}"
    PHARMA_QDRANT__URL: "http://qdrant:6333"
    # Models (LLM, embedding, reranker) come from backend/.env; the override files above
    # point them at local containers instead.

services:
  postgres:
    image: postgres:17.0-alpine
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-vipharmind}"
      POSTGRES_USER: "${POSTGRES_USER:-vipharmind}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-vipharmind}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has bash but no curl or wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend-migrate:
    <<: *backend
    command: ["pharma-agent", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    command: ["pharma-agent", "serve"]
    restart: unless-stopped
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_SITE_URL: "http://localhost:${WEB_PORT:-8080}"
    image: vipharmind-pharma-web:local
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      HOST: "0.0.0.0"
      API_INTERNAL_URL: "http://backend:8000"
      PUBLIC_SITE_URL: "http://localhost:${WEB_PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.30.4-alpine3.24
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - "./devops/nginx/conf.d:/etc/nginx/conf.d:ro"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
