[project]
name = "pharma-lab"
version = "0.4.0"
description = "Utilities for preparing the 2018 Vietnamese National Drug Formulary RAG corpus."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pharma-agent"]

[project.scripts]
pharma-lab = "pharma_lab.cli.app:main"

# pharma-lab is internal offline tooling and never ships, so its libraries are dev-only:
# the backend's dependencies are the only runtime dependencies in the workspace.
[dependency-groups]
dev = [
    "beautifulsoup4==4.15.0",
    "kaggle==2.2.3",
    "numpy==2.5.3",
    "PyMuPDF==1.27.2.3",
    "ragas==0.4.3",
    "requests==2.34.2",
    "scipy==1.18.1",
    "scipy-stubs==1.18.1.0",
    # Same specifier as the backend: a pin would hold the backend CLI back in the shared lock.
    "typer>=0.21",
    "zstandard==0.25.0",
]

[tool.uv]
package = true

[tool.uv.sources]
pharma-agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../ruff.toml"
src = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Docker (run with -m integration)"]
addopts = ["--import-mode=importlib", "-m", "not integration"]
filterwarnings = ["error"]

[tool.importlinter]
root_packages = ["pharma_lab", "pharma_agent"]

[[tool.importlinter.contracts]]
name = "pharma_lab layers, top to bottom"
type = "layers"
# Exhaustive: a new package directly under pharma_lab fails until it is placed in a layer.
containers = ["pharma_lab"]
exhaustive = true
layers = [
    "cli",
    "e2e | data_archive",
    "evaluation | orchestration",
    "bundle",
    "embeddings",
    "integrations",
    "corpus",
    "artifacts",
    "cache",
    "runtime",
    "config | hashing",
]

[[tool.importlinter.contracts]]
name = "Kaggle workers import neither the backend nor the local data layout"
type = "forbidden"
source_modules = ["pharma_lab.integrations.kaggle.workers"]
# The kernel has no pharma-lab workspace: config.paths raises ConfigurationError there.
forbidden_modules = ["pharma_agent", "pharma_lab.config.paths"]

[[tool.importlinter.contracts]]
name = "pharma_lab uses the backend's public surface only"
type = "forbidden"
source_modules = ["pharma_lab"]
forbidden_modules = [
    "pharma_agent.api",
    "pharma_agent.infrastructure.persistence",
]
allow_indirect_imports = true
