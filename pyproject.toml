# uv workspace for every Python project in this repository: one uv.lock and one .venv at the
# root. Run `uv sync` only here; inside a project use `uv run`, which never removes packages.
[tool.uv.workspace]
members = ["backend", "pharma-lab"]

[tool.uv]
# Local runs, the backend image and the uv-lock pre-commit hook pin uv 0.12.13; Vercel's
# Python builder brings its own uv (0.10.11 in October 2026), so only a floor is enforced.
required-version = ">=0.10.11"
# ragas needs instructor, which still caps jiter<0.15 (instructor 1.17), while openai
# >=3.3.1 needs jiter>=0.16. The jiter API instructor uses is unchanged in 0.16+.
override-dependencies = ["jiter>=0.16.0,<1"]

# Development tools shared by every project, pinned once.
[dependency-groups]
dev = [
    "import-linter==2.15",
    "pre-commit==4.6.2",
    "pyrefly==1.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]
